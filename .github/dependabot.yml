# Обновления зависимостей (аудит безопасности 03.10.2026, № 12).
# Раз в неделю — npm, раз в месяц — GitHub Actions. Лимит открытых PR,
# чтобы не утонуть: мелкие версии сгруппированы в один PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Мажорные версии (MUI, i18next, eslint…) — отдельная миграция, не PR
    # «вслепую». Обновления безопасности приходят независимо от этого.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
