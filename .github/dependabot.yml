# Обновления зависимостей (аудит безопасности 03.10.2026, № 12).
# Раз в неделю — npm, раз в месяц — GitHub Actions. Лимит открытых PR,
# чтобы не утонуть.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Патчи — одним PR; минорные версии — по одному PR на пакет: пачка из
    # десятков минорных обновлений разом ломала проверку типов (MUI,
    # apexcharts), и разбирать такое одним PR невозможно.
    groups:
      # Пакеты, которые обновляются только вместе: react и react-dom на
      # разных версиях падают в рантайме, @tiptap/* — при сборке.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      tiptap:
        patterns: ["@tiptap/*"]
      patches:
        update-types: [patch]
    # Мажорные версии (MUI, i18next, eslint…) — отдельная миграция, не PR
    # «вслепую». Обновления безопасности приходят независимо от этого.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Даже патч-версии меняют типы, на которые завязаны наши обёртки
      # (layouts/slotProps, phone-input): обновлять вместе с правкой кода.
      - dependency-name: minimal-shared
      - dependency-name: react-phone-number-input

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
