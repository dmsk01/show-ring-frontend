# CI/CD pipeline фронта Show Ring (GitHub Actions).
#
# Стадии: lint, typecheck, test, audit — на каждый push и PR.
# Деплоя здесь нет: сервер сам забирает коммиты main с зелёным CI
# (deploy/auto-deploy.sh в репозитории бэкенда, systemd-таймер) и собирает
# образ web локально. Self-hosted runner на проде убран (аудит безопасности
# 03.10.2026, № 3).

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Известные уязвимости в прод-зависимостях (аудит безопасности 03.10.2026,
  # № 12). Отдельный job вне обязательных проверок main: новая CVE в
  # зависимости — сигнал, а не блокировка несвязанных PR. Dev-зависимости
  # в прод-образ не попадают, поэтому --omit=dev.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --omit=dev --audit-level=high
